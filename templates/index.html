<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Sandbox — AI-Powered Code Execution & Autonomous Debugging</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            dark: {
              900: '#0B0F17',
              800: '#111827',
              700: '#1F2937',
              600: '#374151',
              500: '#4B5563',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Monaco Editor -->
  <link rel="stylesheet" data-name="vs/css" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0F17;
      color: #E5E7EB;
    }
    .monaco-editor-container {
      width: 100%;
      height: 100%;
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4B5563;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- API CLIENT ---
    const API = {
      async runCode(filename, language, code) {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, language, code })
        });
        if (!res.ok) throw new Error(await res.text());
        return await res.json();
      },
      async debugCode(filename, language, code) {
        const res = await fetch('/api/debug', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, language, code })
        });
        if (!res.ok) throw new Error(await res.text());
        return await res.json();
      },
      async getStats() {
        const res = await fetch('/api/stats');
        return await res.json();
      },
      async getHistory() {
        const res = await fetch('/api/history');
        return await res.json();
      },
      async deleteHistory(id) {
        const res = await fetch(`/api/history/${id}`, { method: 'DELETE' });
        return await res.json();
      },
      async clearHistory() {
        const res = await fetch('/api/history', { method: 'DELETE' });
        return await res.json();
      },
      async getSettings() {
        const res = await fetch('/api/settings');
        return await res.json();
      },
      async getHealth() {
        const res = await fetch('/api/health');
        return await res.json();
      }
    };

    // Default Sample Code with intentional bug
    const DEFAULT_CODE = `def calculate_average(numbers):
    total = sum(numbers)
    average = total / len(number)
    return average

numbers = [10, 20, 30, 40]

print("Average:", calculate_average(numbers))`;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('sandbox'); // 'dashboard', 'sandbox', 'history', 'docs', 'settings'
      const [filename, setFilename] = useState('script.py');
      const [language, setLanguage] = useState('python');
      const [code, setCode] = useState(DEFAULT_CODE);
      
      // Execution & Debug State
      const [isRunning, setIsRunning] = useState(false);
      const [isDebugging, setIsDebugging] = useState(false);
      const [debugStage, setDebugStage] = useState('ready'); // ready, executing, analyzing, fixing, verifying, success, failed
      const [terminalOutput, setTerminalOutput] = useState('');
      const [terminalStderr, setTerminalStderr] = useState('');
      const [terminalTab, setTerminalTab] = useState('output'); // output, errors, logs, ai_analysis
      const [logs, setLogs] = useState([]);
      const [debugReport, setDebugReport] = useState(null);
      const [healthStatus, setHealthStatus] = useState({ status: 'ok', ai_status: 'checking' });

      useEffect(() => {
        API.getHealth().then(setHealthStatus).catch(err => console.error(err));
      }, []);

      const handleRunCode = async () => {
        setIsRunning(true);
        setTerminalOutput('Executing code in sandbox...\n');
        setTerminalStderr('');
        setTerminalTab('output');
        try {
          const res = await API.runCode(filename, language, code);
          setIsRunning(false);
          let out = `$ ${language} ${filename}\n\n`;
          if (res.stdout) out += res.stdout + '\n';
          out += `Process exited with code ${res.exit_code} (${res.execution_time}s)`;
          setTerminalOutput(out);
          setTerminalStderr(res.stderr || '');
          if (res.stderr) setTerminalTab('errors');
        } catch (err) {
          setIsRunning(false);
          setTerminalOutput(`Error executing code: ${err.message}`);
        }
      };

      const handleDebugWithAI = async () => {
        setIsDebugging(true);
        setDebugStage('executing');
        setTerminalTab('ai_analysis');
        setLogs(['[INIT] Requesting AI Debugger workflow...']);
        setDebugReport(null);

        // Simulated Stage Progress for smooth UX
        setTimeout(() => setDebugStage('analyzing'), 800);
        setTimeout(() => setDebugStage('fixing'), 1600);

        try {
          const res = await API.debugCode(filename, language, code);
          setDebugStage('verifying');
          
          setTimeout(() => {
            setIsDebugging(false);
            if (res.success) {
              setDebugStage('success');
              setCode(res.fixed_code); // Apply fix to editor automatically
            } else {
              setDebugStage('failed');
            }
            setDebugReport(res);
            setLogs(res.logs || []);
            
            let out = `$ ${language} ${filename} (AI Debug Run)\n\n`;
            if (res.stdout) out += res.stdout + '\n';
            out += `Process exited with code ${res.exit_code} (${res.execution_time}s) after ${res.attempts} attempt(s)`;
            setTerminalOutput(out);
            setTerminalStderr(res.stderr || '');
          }, 2400);

        } catch (err) {
          setIsDebugging(false);
          setDebugStage('failed');
          setTerminalOutput(`AI Debugging Error: ${err.message}`);
        }
      };

      return (
        <div class="h-full flex flex-col bg-dark-900 text-gray-100">
          {/* Header */}
          <header class="h-14 border-b border-dark-700 bg-dark-800 px-4 flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                AI
              </div>
              <div>
                <h1 class="font-bold text-base tracking-wide flex items-center space-x-2">
                  <span>AI Code Sandbox</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 font-normal">v1.0</span>
                </h1>
              </div>
            </div>

            {/* Nav Tabs */}
            <div class="flex space-x-1 bg-dark-900 p-1 rounded-lg border border-dark-700">
              <button 
                onClick={() => setActiveTab('dashboard')}
                class={`px-3 py-1.5 text-xs font-medium rounded-md transition ${activeTab === 'dashboard' ? 'bg-dark-700 text-white shadow' : 'text-gray-400 hover:text-gray-200'}`}>
                Dashboard
              </button>
              <button 
                onClick={() => setActiveTab('sandbox')}
                class={`px-3 py-1.5 text-xs font-medium rounded-md transition ${activeTab === 'sandbox' ? 'bg-dark-700 text-white shadow' : 'text-gray-400 hover:text-gray-200'}`}>
                Sandbox IDE
              </button>
              <button 
                onClick={() => setActiveTab('history')}
                class={`px-3 py-1.5 text-xs font-medium rounded-md transition ${activeTab === 'history' ? 'bg-dark-700 text-white shadow' : 'text-gray-400 hover:text-gray-200'}`}>
                History
              </button>
              <button 
                onClick={() => setActiveTab('docs')}
                class={`px-3 py-1.5 text-xs font-medium rounded-md transition ${activeTab === 'docs' ? 'bg-dark-700 text-white shadow' : 'text-gray-400 hover:text-gray-200'}`}>
                Documentation
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                class={`px-3 py-1.5 text-xs font-medium rounded-md transition ${activeTab === 'settings' ? 'bg-dark-700 text-white shadow' : 'text-gray-400 hover:text-gray-200'}`}>
                Settings
              </button>
            </div>

            {/* Status Indicators */}
            <div class="flex items-center space-x-4 text-xs">
              <div class="flex items-center space-x-1.5">
                <span class={`w-2 h-2 rounded-full ${healthStatus.ai_status === 'active' ? 'bg-green-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span class="text-gray-400">{healthStatus.ai_status === 'active' ? 'AI Online' : 'AI Fallback Engine'}</span>
              </div>
              <div class="flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span class="text-gray-400">Sandbox Ready</span>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 overflow-hidden">
            {activeTab === 'sandbox' && (
              <SandboxView 
                filename={filename} setFilename={setFilename}
                language={language} setLanguage={setLanguage}
                code={code} setCode={setCode}
                isRunning={isRunning} isDebugging={isDebugging}
                onRun={handleRunCode} onDebug={handleDebugWithAI}
                debugStage={debugStage} debugReport={debugReport} logs={logs}
                terminalOutput={terminalOutput} terminalStderr={terminalStderr}
                terminalTab={terminalTab} setTerminalTab={setTerminalTab}
              />
            )}
            {activeTab === 'dashboard' && <DashboardView onOpenSandbox={() => setActiveTab('sandbox')} />}
            {activeTab === 'history' && <HistoryView onLoadCode={(c) => { setCode(c); setActiveTab('sandbox'); }} />}
            {activeTab === 'docs' && <DocumentationView />}
            {activeTab === 'settings' && <SettingsView />}
          </main>
        </div>
      );
    }

    // --- SANDBOX VIEW ---
    function SandboxView({
      filename, setFilename, language, setLanguage, code, setCode,
      isRunning, isDebugging, onRun, onDebug, debugStage, debugReport, logs,
      terminalOutput, terminalStderr, terminalTab, setTerminalTab
    }) {
      const editorRef = useRef(null);

      return (
        <div class="h-full flex flex-col">
          {/* Main IDE Workspace */}
          <div class="flex-1 flex overflow-hidden">
            {/* Sidebar */}
            <Sidebar 
              filename={filename} setFilename={setFilename}
              language={language} setLanguage={setLanguage}
              onRun={onRun} onDebug={onDebug} isRunning={isRunning} isDebugging={isDebugging}
              onReset={() => setCode(DEFAULT_CODE)} onClearOutput={() => setTerminalOutput('')}
            />

            {/* Code Editor */}
            <div class="flex-1 flex flex-col border-r border-dark-700 bg-dark-900">
              <div class="h-10 border-b border-dark-700 bg-dark-800 px-4 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                  <span class="text-xs font-mono text-blue-400">{filename}</span>
                  <span class="text-xs px-2 py-0.5 rounded bg-dark-700 text-gray-400">{language}</span>
                </div>
                <div class="flex items-center space-x-2">
                  <button 
                    onClick={onRun} disabled={isRunning || isDebugging}
                    class="px-3 py-1 bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white rounded text-xs font-medium flex items-center space-x-1.5 shadow">
                    <span>▶ Run Code</span>
                  </button>
                  <button 
                    onClick={onDebug} disabled={isRunning || isDebugging}
                    class="px-3 py-1 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded text-xs font-medium flex items-center space-x-1.5 shadow">
                    <span>✦ Debug with AI</span>
                  </button>
                  <button 
                    onClick={() => setCode(DEFAULT_CODE)}
                    class="px-2.5 py-1 bg-dark-700 hover:bg-dark-600 text-gray-300 rounded text-xs">
                    ↻ Reset
                  </button>
                </div>
              </div>

              {/* Monaco Editor Container */}
              <div class="flex-1 relative">
                <MonacoEditorComponent value={code} onChange={setCode} language={language} />
              </div>
            </div>

            {/* AI Debugger Panel */}
            <div class="w-80 border-l border-dark-700 bg-dark-800 flex flex-col shrink-0">
              <DebugPanel stage={debugStage} report={debugReport} logs={logs} isDebugging={isDebugging} />
            </div>
          </div>

          {/* Bottom Terminal */}
          <div class="h-56 border-t border-dark-700 bg-dark-900 flex flex-col">
            <Terminal 
              output={terminalOutput} stderr={terminalStderr} logs={logs} report={debugReport}
              activeTab={terminalTab} setActiveTab={setTerminalTab}
            />
          </div>
        </div>
      );
    }

    // --- MONACO EDITOR COMPONENT ---
    function MonacoEditorComponent({ value, onChange, language }) {
      const containerRef = useRef(null);
      const editorInstance = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        window.require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        window.require(['vs/editor/editor.main'], () => {
          if (!editorInstance.current && containerRef.current) {
            editorInstance.current = monaco.editor.create(containerRef.current, {
              value: value,
              language: language === 'python' ? 'python' : 'javascript',
              theme: 'vs-dark',
              automaticLayout: true,
              fontSize: 13,
              fontFamily: 'JetBrains Mono',
              minimap: { enabled: false },
              lineNumbers: 'on',
              scrollBeyondLastLine: false,
              tabSize: 4
            });

            editorInstance.current.onDidChangeModelContent(() => {
              onChange(editorInstance.current.getValue());
            });
          }
        });

        return () => {
          if (editorInstance.current) {
            editorInstance.current.dispose();
            editorInstance.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (editorInstance.current && editorInstance.current.getValue() !== value) {
          editorInstance.current.setValue(value);
        }
      }, [value]);

      return <div ref={containerRef} class="monaco-editor-container" />;
    }

    // --- SIDEBAR ---
    function Sidebar({ filename, setFilename, language, setLanguage, onRun, onDebug, isRunning, isDebugging, onReset, onClearOutput }) {
      return (
        <div class="w-56 border-r border-dark-700 bg-dark-800 p-3 flex flex-col space-y-6 shrink-0">
          <div>
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Workspace</h3>
            <div class="space-y-1">
              <div class="px-2.5 py-1.5 rounded bg-dark-700 text-xs font-medium text-blue-400 flex items-center justify-between border border-blue-500/20">
                <span>{filename}</span>
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Language Runtime</h3>
            <select 
              value={language} onChange={(e) => setLanguage(e.target.value)}
              class="w-full bg-dark-900 border border-dark-700 text-gray-200 text-xs rounded px-2.5 py-1.5 focus:outline-none focus:border-blue-500">
              <option value="python">Python 3.12</option>
              <option value="javascript">JavaScript (Node.js)</option>
            </select>
          </div>

          <div>
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Actions</h3>
            <div class="space-y-1.5">
              <button 
                onClick={onRun} disabled={isRunning || isDebugging}
                class="w-full text-left px-3 py-2 rounded bg-green-600/20 hover:bg-green-600/30 text-green-300 text-xs font-medium border border-green-500/30">
                ▶ Run Code
              </button>
              <button 
                onClick={onDebug} disabled={isRunning || isDebugging}
                class="w-full text-left px-3 py-2 rounded bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 text-xs font-medium border border-blue-500/30">
                ✦ Debug with AI
              </button>
              <button 
                onClick={onReset}
                class="w-full text-left px-3 py-2 rounded bg-dark-700 hover:bg-dark-600 text-gray-300 text-xs font-medium">
                ↻ Reset Sample Code
              </button>
              <button 
                onClick={onClearOutput}
                class="w-full text-left px-3 py-2 rounded bg-dark-700 hover:bg-dark-600 text-gray-400 text-xs font-medium">
                Clear Terminal
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- AI DEBUGGER PANEL ---
    function DebugPanel({ stage, report, logs, isDebugging }) {
      const getStageBadge = (stg) => {
        switch (stg) {
          case 'executing': return <span class="text-amber-400 animate-pulse">⟳ Executing code...</span>;
          case 'analyzing': return <span class="text-blue-400 animate-pulse">✦ AI is analyzing error...</span>;
          case 'fixing': return <span class="text-purple-400 animate-pulse">✦ Generating correction...</span>;
          case 'verifying': return <span class="text-indigo-400 animate-pulse">⟳ Re-running code...</span>;
          case 'success': return <span class="text-green-400 font-bold">✓ Bug Fixed Successfully</span>;
          case 'failed': return <span class="text-red-400 font-bold">✗ Debugging Failed</span>;
          default: return <span class="text-gray-400">● Ready</span>;
        }
      };

      return (
        <div class="h-full flex flex-col p-4 space-y-4 overflow-y-auto">
          <div class="border-b border-dark-700 pb-3">
            <h2 class="font-semibold text-sm text-gray-100 flex items-center justify-between">
              <span>AI Debugger</span>
              <span class="text-xs px-2 py-0.5 rounded bg-dark-700">{getStageBadge(stage)}</span>
            </h2>
          </div>

          {/* AI Analysis Cards */}
          {report && (
            <div class="space-y-4 text-xs">
              {/* Error Type & Line */}
              <div class="p-3 bg-red-950/30 border border-red-900/50 rounded-lg">
                <div class="flex items-center justify-between mb-1">
                  <span class="font-semibold text-red-400">{report.error_type || 'Runtime Error'}</span>
                  <span class="text-gray-400">Line {report.error_line || 1}</span>
                </div>
                <p class="text-gray-300 text-xs mt-1">{report.root_cause}</p>
              </div>

              {/* Fix Explanation */}
              <div class="p-3 bg-dark-900 border border-dark-700 rounded-lg space-y-2">
                <span class="font-semibold text-blue-400 block">AI Fix Explanation</span>
                <p class="text-gray-300">{report.fix_explanation}</p>
              </div>

              {/* Code Changes Diff */}
              {report.changes && report.changes.length > 0 && (
                <div class="p-3 bg-dark-900 border border-dark-700 rounded-lg space-y-2">
                  <span class="font-semibold text-gray-300 block">Proposed Code Changes</span>
                  <div class="font-mono text-xs space-y-1">
                    {report.changes.map((c, i) => (
                      <div key={i} class="space-y-0.5">
                        <div class="text-red-400 bg-red-950/40 px-2 py-1 rounded truncate">- {c.before}</div>
                        <div class="text-green-400 bg-green-950/40 px-2 py-1 rounded truncate">+ {c.after}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Verification Results */}
              <div class="p-3 bg-dark-900 border border-dark-700 rounded-lg space-y-1.5">
                <span class="font-semibold text-gray-300 block mb-1">Verification Checklist</span>
                <div class="text-green-400 flex items-center space-x-2">
                  <span>✓</span> <span>Code Executed</span>
                </div>
                <div class="text-green-400 flex items-center space-x-2">
                  <span>✓</span> <span>Exit Code: {report.exit_code}</span>
                </div>
                <div class="text-green-400 flex items-center space-x-2">
                  <span>✓</span> <span>{report.attempts} Debug Attempt(s)</span>
                </div>
              </div>
            </div>
          )}

          {!report && !isDebugging && (
            <div class="flex-1 flex flex-col items-center justify-center text-center p-6 text-gray-500 space-y-2">
              <div class="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center text-gray-400 text-lg">✦</div>
              <p class="text-xs">Click "Debug with AI" to automatically detect, diagnose, and fix code bugs.</p>
            </div>
          )}
        </div>
      );
    }

    // --- TERMINAL ---
    function Terminal({ output, stderr, logs, report, activeTab, setActiveTab }) {
      return (
        <div class="h-full flex flex-col font-mono text-xs">
          <div class="h-8 bg-dark-800 border-b border-dark-700 px-4 flex items-center space-x-4">
            <button 
              onClick={() => setActiveTab('output')}
              class={`h-full border-b-2 font-medium px-1 flex items-center space-x-1 ${activeTab === 'output' ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
              <span>Output</span>
            </button>
            <button 
              onClick={() => setActiveTab('errors')}
              class={`h-full border-b-2 font-medium px-1 flex items-center space-x-1 ${activeTab === 'errors' ? 'border-red-500 text-red-400' : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
              <span>Errors {stderr ? '●' : ''}</span>
            </button>
            <button 
              onClick={() => setActiveTab('logs')}
              class={`h-full border-b-2 font-medium px-1 flex items-center space-x-1 ${activeTab === 'logs' ? 'border-purple-500 text-purple-400' : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
              <span>Logs</span>
            </button>
            <button 
              onClick={() => setActiveTab('ai_analysis')}
              class={`h-full border-b-2 font-medium px-1 flex items-center space-x-1 ${activeTab === 'ai_analysis' ? 'border-green-500 text-green-400' : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
              <span>AI Agent Logs</span>
            </button>
          </div>

          <div class="flex-1 p-4 overflow-y-auto bg-dark-950 text-gray-300">
            {activeTab === 'output' && <pre class="whitespace-pre-wrap">{output || 'No output recorded yet. Run code to execute.'}</pre>}
            {activeTab === 'errors' && <pre class="whitespace-pre-wrap text-red-400">{stderr || 'No error tracebacks captured.'}</pre>}
            {activeTab === 'logs' && (
              <div class="space-y-1">
                {logs && logs.length > 0 ? logs.map((l, i) => <div key={i} class="text-blue-300">{l}</div>) : 'No execution logs.'}
              </div>
            )}
            {activeTab === 'ai_analysis' && (
              <div class="space-y-2">
                {report ? (
                  <div class="space-y-2 text-xs">
                    <div class="text-green-400 font-bold">=== AI DEBUGGER VERIFICATION REPORT ===</div>
                    <div>Status: {report.success ? 'RESOLVED' : 'FAILED'}</div>
                    <div>Error Type: {report.error_type}</div>
                    <div>Root Cause: {report.root_cause}</div>
                    <div>Fix Explanation: {report.fix_explanation}</div>
                    <div>Output: {report.stdout || '(None)'}</div>
                  </div>
                ) : (
                  <div>Run AI Debugger to generate agent workflow trace.</div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- DASHBOARD VIEW ---
    function DashboardView({ onOpenSandbox }) {
      const [stats, setStats] = useState(null);

      useEffect(() => {
        API.getStats().then(setStats).catch(console.error);
      }, []);

      return (
        <div class="p-8 max-w-6xl mx-auto space-y-8 overflow-y-auto h-full">
          <div>
            <h2 class="text-2xl font-bold tracking-tight text-white">Dashboard Overview</h2>
            <p class="text-sm text-gray-400 mt-1">Real-time statistics for code execution and AI debugging sessions.</p>
          </div>

          {/* Metric Cards */}
          <div class="grid grid-cols-4 gap-4">
            <div class="p-5 bg-dark-800 border border-dark-700 rounded-xl space-y-2">
              <span class="text-xs text-gray-400 font-medium">Total Executions</span>
              <div class="text-3xl font-bold text-white">{stats ? stats.total_executions : 0}</div>
            </div>
            <div class="p-5 bg-dark-800 border border-dark-700 rounded-xl space-y-2">
              <span class="text-xs text-gray-400 font-medium">Bugs Detected</span>
              <div class="text-3xl font-bold text-amber-400">{stats ? stats.bugs_detected : 0}</div>
            </div>
            <div class="p-5 bg-dark-800 border border-dark-700 rounded-xl space-y-2">
              <span class="text-xs text-gray-400 font-medium">Bugs Fixed</span>
              <div class="text-3xl font-bold text-green-400">{stats ? stats.bugs_fixed : 0}</div>
            </div>
            <div class="p-5 bg-dark-800 border border-dark-700 rounded-xl space-y-2">
              <span class="text-xs text-gray-400 font-medium">Success Rate</span>
              <div class="text-3xl font-bold text-blue-400">{stats ? `${stats.success_rate}%` : '100%'}</div>
            </div>
          </div>

          {/* Recent Activity Table */}
          <div class="bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-semibold text-lg text-white">Recent Debugging Activity</h3>
              <button onClick={onOpenSandbox} class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-medium">
                + Launch Sandbox
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-gray-300">
                <thead class="bg-dark-900 text-gray-400 border-b border-dark-700">
                  <tr>
                    <th class="p-3">Filename</th>
                    <th class="p-3">Language</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Error Type</th>
                    <th class="p-3">Execution Time</th>
                    <th class="p-3">Date</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-dark-700">
                  {stats && stats.recent_activity.length > 0 ? (
                    stats.recent_activity.map((item) => (
                      <tr key={item.id} class="hover:bg-dark-700/50">
                        <td class="p-3 font-mono text-blue-400">{item.filename}</td>
                        <td class="p-3">{item.language}</td>
                        <td class="p-3">
                          <span class={`px-2 py-0.5 rounded ${item.status === 'fixed' || item.status === 'success' ? 'bg-green-950 text-green-400' : 'bg-red-950 text-red-400'}`}>
                            {item.status}
                          </span>
                        </td>
                        <td class="p-3 font-mono">{item.error_type || '-'}</td>
                        <td class="p-3">{item.execution_time}s</td>
                        <td class="p-3 text-gray-400">{new Date(item.created_at).toLocaleString()}</td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="6" class="p-4 text-center text-gray-500">No activity recorded yet. Run a session in Sandbox IDE!</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- HISTORY VIEW ---
    function HistoryView({ onLoadCode }) {
      const [history, setHistory] = useState([]);
      const [selectedSession, setSelectedSession] = useState(null);

      const fetchHistory = () => API.getHistory().then(setHistory).catch(console.error);

      useEffect(() => { fetchHistory(); }, []);

      const handleDelete = async (id) => {
        await API.deleteHistory(id);
        fetchHistory();
        if (selectedSession && selectedSession.id === id) setSelectedSession(null);
      };

      const handleClear = async () => {
        await API.clearHistory();
        fetchHistory();
        setSelectedSession(null);
      };

      return (
        <div class="p-8 max-w-6xl mx-auto space-y-6 overflow-y-auto h-full">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-bold text-white">Execution & Debugging History</h2>
              <p class="text-sm text-gray-400 mt-1">Review past code execution sessions, AI bug analysis, and output diffs.</p>
            </div>
            {history.length > 0 && (
              <button onClick={handleClear} class="px-3 py-1.5 bg-red-600/20 text-red-300 hover:bg-red-600/30 rounded text-xs font-medium border border-red-500/30">
                Clear History
              </button>
            )}
          </div>

          <div class="grid grid-cols-3 gap-6">
            {/* Session List */}
            <div class="col-span-1 bg-dark-800 border border-dark-700 rounded-xl p-4 space-y-2 overflow-y-auto max-h-[600px]">
              {history.map((s) => (
                <div 
                  key={s.id} 
                  onClick={() => setSelectedSession(s)}
                  class={`p-3 rounded-lg border cursor-pointer transition ${selectedSession && selectedSession.id === s.id ? 'bg-dark-700 border-blue-500' : 'bg-dark-900 border-dark-700 hover:border-gray-600'}`}>
                  <div class="flex items-center justify-between">
                    <span class="font-mono text-xs font-semibold text-blue-400">{s.filename}</span>
                    <span class={`text-[10px] px-1.5 py-0.5 rounded ${s.status === 'fixed' || s.status === 'success' ? 'bg-green-950 text-green-400' : 'bg-red-950 text-red-400'}`}>
                      {s.status}
                    </span>
                  </div>
                  <div class="text-xs text-gray-400 mt-1">{s.error_type || 'Clean Run'}</div>
                  <div class="text-[10px] text-gray-500 mt-2">{new Date(s.created_at).toLocaleString()}</div>
                </div>
              ))}
            </div>

            {/* Session Detail */}
            <div class="col-span-2 bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-4">
              {selectedSession ? (
                <div class="space-y-4 text-xs">
                  <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                    <div>
                      <h3 class="font-bold text-base text-white">{selectedSession.filename} ({selectedSession.language})</h3>
                      <span class="text-gray-400">Session ID: {selectedSession.id}</span>
                    </div>
                    <div class="flex space-x-2">
                      <button onClick={() => onLoadCode(selectedSession.fixed_code || selectedSession.original_code)} class="px-3 py-1 bg-blue-600 text-white rounded text-xs">
                        Open in Editor
                      </button>
                      <button onClick={() => handleDelete(selectedSession.id)} class="px-3 py-1 bg-red-600/20 text-red-300 rounded text-xs">
                        Delete
                      </button>
                    </div>
                  </div>

                  {selectedSession.root_cause && (
                    <div class="p-3 bg-dark-900 border border-dark-700 rounded">
                      <span class="font-semibold text-blue-400 block mb-1">Root Cause</span>
                      <p>{selectedSession.root_cause}</p>
                    </div>
                  )}

                  <div class="space-y-1">
                    <span class="font-semibold text-gray-300">Original Source Code</span>
                    <pre class="p-3 bg-dark-950 rounded font-mono text-gray-300 overflow-x-auto max-h-40">{selectedSession.original_code}</pre>
                  </div>

                  {selectedSession.fixed_code && (
                    <div class="space-y-1">
                      <span class="font-semibold text-green-400">AI Fixed Source Code</span>
                      <pre class="p-3 bg-dark-950 rounded font-mono text-green-300 overflow-x-auto max-h-40">{selectedSession.fixed_code}</pre>
                    </div>
                  )}

                  <div class="space-y-1">
                    <span class="font-semibold text-gray-300">Execution Output</span>
                    <pre class="p-3 bg-dark-950 rounded font-mono text-gray-300">{selectedSession.stdout || selectedSession.stderr || 'No output'}</pre>
                  </div>
                </div>
              ) : (
                <div class="p-12 text-center text-gray-500">Select a history session to view code and AI debugging details.</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- DOCUMENTATION VIEW ---
    function DocumentationView() {
      return (
        <div class="p-8 max-w-4xl mx-auto space-y-8 overflow-y-auto h-full text-gray-300">
          <div>
            <h2 class="text-3xl font-bold text-white mb-2">AI Code Sandbox Documentation</h2>
            <p class="text-sm text-gray-400">Comprehensive technical reference, architecture guide, and API documentation.</p>
          </div>

          <div class="space-y-6 text-sm">
            <section class="bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-3">
              <h3 class="font-bold text-lg text-white">1. Getting Started</h3>
              <p>AI Code Sandbox is an AI-powered cloud IDE that executes code safely in an isolated sandbox environment, captures runtime errors, and uses LLM AI agents to automatically analyze, patch, re-run, and verify corrected code.</p>
            </section>

            <section class="bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-3">
              <h3 class="font-bold text-lg text-white">2. Autonomous AI Debugging Workflow</h3>
              <ol class="list-decimal list-inside space-y-2 text-gray-400">
                <li>Code execution request is sent to backend API sandbox.</li>
                <li>Process execution occurs inside an isolated temporary filesystem with resource limits.</li>
                <li>If stderr runtime errors or non-zero exit codes occur, code and traceback are forwarded to the AI Debugger service.</li>
                <li>AI performs root-cause diagnosis and returns a structured JSON fix with exact line-by-line before/after diffs.</li>
                <li>The corrected code is re-executed and verified for zero exit code up to 3 times.</li>
              </ol>
            </section>

            <section class="bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-3">
              <h3 class="font-bold text-lg text-white">3. API Reference</h3>
              <div class="font-mono text-xs space-y-2 text-blue-400">
                <div>POST /api/run - Execute code safely in sandbox</div>
                <div>POST /api/debug - Run autonomous AI debugging loop</div>
                <div>GET /api/history - Retrieve execution history sessions</div>
                <div>GET /api/stats - Retrieve real-time dashboard analytics</div>
                <div>GET /api/health - Check service and AI status</div>
              </div>
            </section>
          </div>
        </div>
      );
    }

    // --- SETTINGS VIEW ---
    function SettingsView() {
      const [settings, setSettings] = useState({ sandbox_timeout: 10, max_debug_attempts: 3, ai_model: 'gemini-2.5-flash', ai_status: 'checking' });

      useEffect(() => {
        API.getSettings().then(setSettings).catch(console.error);
      }, []);

      return (
        <div class="p-8 max-w-3xl mx-auto space-y-6 overflow-y-auto h-full text-gray-300">
          <div>
            <h2 class="text-2xl font-bold text-white mb-1">System Settings</h2>
            <p class="text-sm text-gray-400">Configure runtime parameters, timeout thresholds, and AI models.</p>
          </div>

          <div class="bg-dark-800 border border-dark-700 rounded-xl p-6 space-y-4 text-xs">
            <div>
              <label class="block text-gray-400 font-medium mb-1">Sandbox Execution Timeout (seconds)</label>
              <input type="number" value={settings.sandbox_timeout} onChange={(e) => setSettings({...settings, sandbox_timeout: parseInt(e.target.value)})} class="w-full bg-dark-900 border border-dark-700 rounded px-3 py-2 text-white" />
            </div>

            <div>
              <label class="block text-gray-400 font-medium mb-1">Maximum AI Debug Attempts</label>
              <input type="number" value={settings.max_debug_attempts} onChange={(e) => setSettings({...settings, max_debug_attempts: parseInt(e.target.value)})} class="w-full bg-dark-900 border border-dark-700 rounded px-3 py-2 text-white" />
            </div>

            <div>
              <label class="block text-gray-400 font-medium mb-1">AI Debugger Engine Status</label>
              <div class="p-3 bg-dark-900 border border-dark-700 rounded text-blue-400 font-mono">
                {settings.ai_status}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render Root App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
